irement quel véhicule était concerné?", "• Les véhicules ou commandes étaient-ils faciles à distinguer?", "• L’état du système était-il clair?", "• Le retour après une action était-il suffisamment visible?"], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 22\n1 · TECHNOLOGIE / INTERFACE\n• L’information nécessaire était-elle disponible?\n• L’alarme indiquait-elle clairement quel véhicule était concerné?\n• Les véhicules ou commandes étaient-ils faciles à distinguer?\n• L’état du système était-il clair?\n• Le retour après une action était-il suffisamment visible?"}, {"num": 22, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "2 · TÂCHE / CONTEXTE", "subtitle": "On cherche ce que le travail demandait à ce moment précis.", "points": ["• Combien de machines l’opératrice surveillait-elle?", "• Que devait-elle faire en parallèle?", "• Plusieurs alarmes ou événements se produisaient-ils?", "• Y avait-il de la pression temporelle?", "• Des interruptions?", "• La situation était-elle inhabituelle?"], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 23\n2 · TÂCHE / CONTEXTE\n• Combien de machines l’opératrice surveillait-elle?\n• Que devait-elle faire en parallèle?\n• Plusieurs alarmes ou événements se produisaient-ils?\n• Y avait-il de la pression temporelle?\n• Des interruptions?\n• La situation était-elle inhabituelle?\nOn cherche ce que le travail demandait à ce moment précis."}, {"num": 23, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "3 · ORGANISATION / INTERACTIONS", "subtitle": "L’action individuelle s’inscrit dans une organisation et des interactions.", "points": ["• Les rôles étaient-ils clairs?", "• Qui devait surveiller quoi?", "• La communication était-elle adéquate?", "• Le personnel était-il suffisant?", "• La formation préparait-elle à ce type de situation?"], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 24\n3 · ORGANISATION / INTERACTIONS\n• Les rôles étaient-ils clairs?\n• Qui devait surveiller quoi?\n• La communication était-elle adéquate?\n• Le personnel était-il suffisant?\n• La formation préparait-elle à ce type de situation?\nL’action individuelle s’inscrit dans une organisation et des interactions."}, {"num": 24, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Plusieurs explications deviennent possibles", "subtitle": "À ce stade, ce sont encore des hypothèses. Comment savoir lesquelles sont pertinentes?", "points": ["TECHNOLOGIE : Le mauvais véhicule était peut-être difficile à distinguer.", "TÂCHE : L’opérateur gérait peut-être plusieurs demandes simultanément.", "ORGANISATION : La répartition des responsabilités était peut-être ambiguë."], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 25\nPlusieurs explications deviennent possibles\nTECHNOLOGIE\nLe mauvais véhicule\nétait peut-être difficile à\ndistinguer.\nTÂCHE\nL’opérateur gérait peut-\nêtre plusieurs\ndemandes\nsimultanément.\nORGANISATION\nLa répartition des\nresponsabilités était\npeut-être ambiguë.\nMais à ce stade, ce sont encore des hypothèses.\nComment savoir lesquelles sont réellement pertinentes?"}, {"num": 25, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Avant de conclure que le problème vient de…", "subtitle": "Manque d’attention? Trop de charge mentale? Trop de stress? Ambiguïté des rôles?", "points": ["• Il faut d’abord comprendre ce que la personne devait réellement accomplir et dans quelles conditions.", "• C’est là que l’analyse de la tâche devient utile."], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 26\nAvant de conclure que le problème vient\nde…\nMANQUE D’ATTENTION? TROP DE CHARGE MENTALE?\nTROP DE STRESS? AMBIGUITÉ DES ROLES?\nIl faut d’abord comprendre ce que la personne devait réellement\naccomplir et dans quelles conditions.\nC’est là que l’analyse de la tâche devient utile."}, {"num": 26, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Analyse de la tâche / du travail", "subtitle": "Décrire ce que la personne doit accomplir et ce dont elle a besoin pour y arriver.", "points": ["1. Quel est l’objectif?", "2. Quelles actions / étapes?", "3. Quelle information est nécessaire?", "4. Quelles décisions doivent être prises?", "5. Quelles contraintes / interactions influencent le travail?"], "raw_text": "Analyse de la tâche/du travail\nDécrire ce que la personne doit accomplir et ce dont elle a besoin pour\ny arriver.\n1. Quel est l’objectif?\n2. Quelles actions / étapes?\n3. Quelle information est nécessaire?\n4. Quelles décisions doivent être prises?\n5. Quelles contraintes / interactions influencent le travail?\nCOMPRENDRE · SYSTÈME ET TRAVAIL 27"}, {"num": 27, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Exemple : téléopérer une machine", "subtitle": "À partir de là, on peut commencer à demander quelles dimensions humaines sont pertinentes.", "points": ["• Objectif : Réaliser l’opération prévue", "• Information nécessaire : État des machines, environnement, alarmes", "• Actions et décisions : Surveiller, sélectionner, intervenir, reprendre le contrôle", "• Contraintes : Plusieurs véhicules, interruptions, variabilité", "• Interactions : Automatisation, autres travailleurs, procédures"], "raw_text": "Exemple : téléopérer une machine\nCOMPRENDRE · SYSTÈME ET TRAVAIL 28\nÀ partir de là, on peut commencer à demander quelles dimensions humaines sont réellement pertinentes.\nCe qu’on cherche à\ncomprendre Dans cet exemple\nObjectif Réaliser l’opération prévue\nInformation nécessaire État des machines, environnement,\nalarmes\nActions et décisions Surveiller, sélectionner, intervenir,\nreprendre le contrôle\nContraintes Plusieurs véhicules, interruptions,\nvariabilité\nInteractions Automatisation, autres travailleurs,\nprocédures"}, {"num": 28, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Maintenant qu’on comprend la tâche et le travail…", "subtitle": "Qu’est-ce qu’on peut vouloir comprendre du côté humain?", "points": ["COGNITIF : Comment la personne perçoit, comprend et gère les exigences mentales.", "PSYCHOSOCIAL : Comment elle vit son travail et sa relation avec celui-ci.", "COMPORTEMENTAL : Ce qu’elle fait et les résultats observables de son activité."], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 29\nMaintenant qu’on comprend la tâche et le\ntravail…\nQu’est-ce qu’on peut vouloir comprendre du côté humain?\nCOGNITIF\nComment la personne\nperçoit, comprend et\ngère les exigences\nmentales.\nPSYCHOSOCIAL\nComment elle vit son\ntravail et sa relation\navec celui-ci.\nCOMPORTEMENTAL\nCe qu’elle fait et les\nrésultats observables\nde son activité."}, {"num": 29, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "COGNITIF", "subtitle": "Les processus mentaux et les états qui influencent la façon dont une personne perçoit, comprend et gère les exigences de son travail.", "points": ["• Attention", "• Modèles mentaux", "• Conscience de la situation", "• Charge mentale", "• Vigilance", "• Fatigue"], "raw_text": "COGNITIF\nLes processus mentaux et les états qui influencent la\nfaçon dont une personne perçoit, comprend et gère\nles exigences de son travail.\nCOMPRENDRE · DIMENSIONS HUMAINES 31\nattention modèles mentaux conscience de la situation\ncharge mentale vigilance fatigue\nEtc."}, {"num": 30, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Attention", "subtitle": "Le processus qui permet de sélectionner et de prioriser certaines informations ou actions.", "points": ["• Elle est sélective : certaines informations sont privilégiées alors que d’autres peuvent être moins traitées ou passer inaperçues.", "• RÈGLE D'OR : Présent ≠ nécessairement pris en compte.", "• Nos buts et les autres demandes de la situation influencent ce qui reçoit notre attention."], "raw_text": "Attention\nL’attention est le processus qui permet de sélectionner et de prioriser\ncertaines informations ou actions parmi plusieurs possibilités.\nElle est sélective : certaines informations sont privilégiées alors que\nd’autres peuvent être moins traitées ou passer inaperçues.\nPrésent ≠ nécessairement pris en compte\nNos buts et les autres demandes de la situation influencent ce qui\nreçoit notre attention.\nCOMPRENDRE · DIMENSIONS HUMAINES 33\nCOGNITIF"}, {"num": 31, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "En téléopération : plusieurs informations peuvent demander de l’attention", "subtitle": "Qu’est-ce qui doit être remarqué, et à quel moment?", "points": ["• plusieurs machines", "• écrans", "• alarmes", "• événements simultanés", "• communications", "• reprises de contrôle"], "raw_text": "En téléopération : plusieurs informations\npeuvent demander de l’attention\n•plusieurs machines\n•écrans\n•alarmes\n•événements simultanés\n•communications\n•reprises de contrôle.\nQu’est-ce qui doit être\nremarqué, et à quel moment?\nCOMPRENDRE · DIMENSIONS HUMAINES 34"}, {"num": 32, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Remarquer l’information ne suffit pas", "subtitle": "Il faut aussi comprendre comment le système fonctionne et ce que ses actions signifient.", "points": ["→ MODÈLE MENTAL"], "raw_text": "Remarquer l’information ne suffit pas\nIl faut aussi comprendre comment le système\nfonctionne et ce que ses actions signifient.\n→ MODÈLE MENTAL\nCOMPRENDRE · DIMENSIONS HUMAINES 35"}, {"num": 33, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Modèle mental", "subtitle": "Une représentation que la personne se construit du fonctionnement d’un système.", "points": ["• Elle guide ses attentes : « si X se produit, je m’attends à Y. »", "• EXEMPLE : Si je règle le thermostat à 30 °C, la pièce chauffera plus vite.", "• Erreur de modèle mental : cette action suppose que la température réglée contrôle la vitesse de chauffage, alors qu'avec un thermostat simple, elle détermine plutôt la température cible."], "raw_text": "Modèle mental\nUne représentation que la personne se construit du fonctionnement\nd’un système.\nElle guide ses attentes : « si X se produit, je m’attends à Y. »\nEXEMPLE\nSi je règle le thermostat à 30 °C, la pièce chauffera plus vite\nCOMPRENDRE · DIMENSIONS HUMAINES 36\nCOGNITIF\nCette action suppose que la température réglée contrôle la vitesse de chauffage.Avec un thermostat\nsimple, elle détermine plutôt la température cible."}, {"num": 34, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Conscience de la situation", "subtitle": "COGNITIF · Situation awareness", "points": ["• Définition : Maintenir une compréhension de ce qui se passe dans une situation dynamique, de ce que cela signifie et de ce qui pourrait se produire ensuite.", "• TRIPTYQUE FONDAMENTAL : PERCEVOIR → COMPRENDRE → ANTICIPER"], "raw_text": "Conscience de la situation\nCOGNITIF · Situation awareness\nMaintenir une compréhension de ce qui se passe dans une situation\ndynamique, de ce que cela signifie et de ce qui pourrait se produire\nensuite.\nPERCEVOIR → COMPRENDRE → ANTICIPER\nCOMPRENDRE · DIMENSIONS HUMAINES 38"}, {"num": 35, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Même contexte, différentes questions cognitives", "subtitle": "Exemple en téléopération", "points": ["ATTENTION : Quelles informations l’opératrice remarque-t-elle et surveille-t-elle?", "MODÈLE MENTAL : Comment pense-t-il que le système fonctionne et réagit à ses actions?", "CONSCIENCE DE LA SITUATION : Comprend-il l’état actuel des véhicules, ce que cela signifie et ce qui pourrait arriver ensuite?"], "raw_text": "Même contexte, différentes questions\ncognitives\nATTENTION\nQuelles informations l’opératrice remarque-t-\nelle et surveille-t-elle?\nMODÈLE MENTAL\nComment pense-t-il que le système\nfonctionne et réagit à ses actions?\nCONSCIENCE DE LA SITUATION\nComprend-il l’état actuel des véhicules, ce\nque cela signifie et ce qui pourrait arriver\nensuite?\nCOMPRENDRE · DIMENSIONS HUMAINES 39"}, {"num": 36, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Charge mentale", "subtitle": "COGNITIF · Mental workload", "points": ["• La charge mentale correspond à l’effort mental nécessaire pour répondre aux exigences d’une tâche dans une situation donnée."], "raw_text": "Charge mentale\nCOGNITIF · Mental workload\nLa charge mentale correspond à l’effort mental nécessaire pour\nrépondre aux exigences d’une tâche dans une situation donnée.\nCOMPRENDRE · DIMENSIONS HUMAINES 41"}, {"num": 37, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Vigilance", "subtitle": "Maintenir son attention dans le temps afin de détecter des événements pertinents, parfois rares ou imprévisibles.", "points": ["• Séquence : Période calme → Surveillance prolongée → Événement à détecter", "• À retenir : Une tâche peu active peut quand même exiger une surveillance soutenue."], "raw_text": "Vigilance\nMaintenir son attention dans le temps afin de détecter des événements\npertinents, parfois rares ou imprévisibles.\npériode calme → surveillance prolongée → événement à détecter\nUne tâche peu active peut quand même exiger une surveillance soutenue.\nCOMPRENDRE · DIMENSIONS HUMAINES 43\nCOGNITIF"}, {"num": 38, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Fatigue", "subtitle": "Un état qui peut réduire la capacité, ou augmenter l’effort nécessaire, pour maintenir une activité dans le temps.", "points": ["Facteurs contributifs :", "• durée du quart · activité prolongée · exigences répétées · manque de récupération · sommeil / horaire", "* Note : Peut entrer dans plusieurs catégories (physique, cognitive, psychosociale)."], "raw_text": "Fatigue\nUn état qui peut réduire la capacité, ou augmenter l’effort nécessaire,\npour maintenir une activité dans le temps.\n•durée du quart\n•activité prolongée\n•exigences répétées\n•manque de récupération\n•sommeil / horaire\nCOMPRENDRE · DIMENSIONS HUMAINES 44\nCOGNITIF*\n* Peut rentrer dans plusieurs catégories"}, {"num": 39, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "PSYCHOSOCIAL", "subtitle": "Comment la personne vit-elle son travail et sa relation avec celui-ci?", "points": ["• Stress", "• Autonomie", "• Motivation", "• Frustration / satisfaction"], "raw_text": "PSYCHOSOCIAL\nComment la personne vit-elle son travail et sa relation\navec celui-ci?\nCOMPRENDRE · DIMENSIONS HUMAINES 45\nstress autonomie\nmotivation frustration / satisfaction\nEtc."}, {"num": 40, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Stress", "subtitle": "État de tension lorsqu'une personne perçoit que les exigences sont difficiles à gérer avec ses ressources.", "points": ["Sources de stress :", "• pression de temps", "• incertitude", "• conséquences possibles d’une erreur", "• interruptions", "• organisation du travail"], "raw_text": "Stress\nÉtat de tension qui peut apparaître lorsqu’une personne perçoit que les\nexigences ou les enjeux d’une situation sont difficiles à gérer avec les\nressources dont elle dispose.\n•pression de temps\n•incertitude\n•conséquences possibles d’une erreur\n•interruptions\n•organisation du travail.\nCOMPRENDRE · DIMENSIONS HUMAINES 46\nPSYCHOSOCIAL"}, {"num": 41, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Autonomie", "subtitle": "Le degré de liberté et de contrôle qu’une personne perçoit dans l'accomplissement de son travail.", "points": ["• choisir comment réaliser une tâche", "• décider de l’ordre ou du rythme de certaines actions", "• adapter sa façon de faire à la situation", "• intervenir ou reprendre le contrôle lorsque nécessaire"], "raw_text": "Autonomie\nLe degré de liberté et de contrôle qu’une personne perçoit dans la\nfaçon d’organiser et d’accomplir son travail.\n•choisir comment réaliser une tâche\n•décider de l’ordre ou du rythme de certaines actions\n•adapter sa façon de faire à la situation\n•intervenir ou reprendre le contrôle lorsque nécessaire\nCOMPRENDRE · DIMENSIONS HUMAINES 47\nPSYCHOSOCIAL"}, {"num": 42, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Une technologie peut modifier qui prend les décisions", "subtitle": "La personne reste dans le système, mais son rôle peut changer. Est-ce que cela modifie son autonomie?", "points": ["TECHNOLOGIE QUI AIDE À LA DÉCISION :", "• La personne examine et décide.", "TECHNOLOGIE PLUS PRESCRIPTIVE :", "• Le système prend davantage de décisions ou agit automatiquement.", "• La personne surveille, confirme ou intervient au besoin."], "raw_text": "Une technologie peut modifier qui prend les\ndécisions\nLa technologie aide à la décision\nLa personne examine et décide.\nTechnologie plus prescriptive\n• Le système prend davantage de\ndécisions ou agit automatiquement.\n• La personne surveille, confirme ou\nintervient au besoin.\nLa personne reste dans le système, mais son rôle peut changer.\nEst-ce que cela modifie son autonomie?\nCOMPRENDRE · DIMENSIONS HUMAINES 48"}, {"num": 43, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Motivation", "subtitle": "Processus qui orientent l’action, déterminent l’effort investi et soutiennent la persistance dans le temps.", "points": ["TROIS COMPOSANTES :", "• DIRECTION : Vers quoi la personne dirige-t-elle ses efforts?", "• INTENSITÉ : Combien d’effort est-elle prête à investir?", "• PERSISTANCE : Combien de temps maintient-elle cet effort?"], "raw_text": "Motivation\nProcessus qui orientent l’action, déterminent l’effort qu’une\npersonne investit et soutiennent sa persistance dans le temps.\nLa façon dont le travail est organisé, et le rôle laissé à la personne, peut influencer sa\nmotivation.\nCOMPRENDRE · DIMENSIONS HUMAINES 49\nPSYCHOSOCIAL\nDIRECTION\nVers quoi la personne dirige-t-elle ses efforts?\nINTENSITÉ\nCombien d’effort est-elle prête à investir?\nPERSISTANCE\nCombien de temps maintient-elle cet effort?"}, {"num": 44, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Frustration / satisfaction", "subtitle": "L’expérience du travail ou de l’utilisation d’une technologie peut aussi être pertinente.", "points": ["FRUSTRATION : système imprévisible · étapes inutiles · information difficile à comprendre.", "SATI ance soutenue\n• charge mentale perçue plus élevée\npendant les périodes les plus exigeantes\n• fatigue possible lorsque l’activité se\nprolonge\nCOMPORTEMENT / PERFORMANCE\n• certaines anomalies sont parfois\nmanquées\n• davantage de vérifications lorsque les\nexigences augmentent"}, {"num": 74, "category": "2 · CONCEVOIR — INTERVENTIONS & AUTOMATISATION", "title": "Du constat au diagnostic", "subtitle": "Établir un diagnostic clair pour fixer l'objectif de conception", "points": ["DIAGNOSTIC :", "• Ce n’est pas simplement un problème de « manque d’attention ».", "• La combinaison d’une surveillance prolongée, de défauts rares et de périodes de forte demande augmente les exigences imposées à l’opérateur.", "OBJECTIF DE CONCEPTION :", "• Soutenir la détection des défauts tout en maintenant une charge mentale acceptable et la capacité de l’opérateur à vérifier et intervenir."], "raw_text": "CONCEVOIR 102\nDu constat au diagnostic\nDIAGNOSTIC\nCe n’est pas simplement un problème de « manque d’attention ».\nLa combinaison d’une surveillance prolongée, de défauts rares et de périodes\nde forte demande peut rendre la détection plus difficile et augmenter les\nexigences imposées à l’opérateur.\nOBJECTIF DE CONCEPTION\nSoutenir la détection des défauts tout en maintenant une charge mentale\nacceptable et la capacité de l’opérateur à vérifier et intervenir."}, {"num": 75, "category": "2 · CONCEVOIR — INTERVENTIONS & AUTOMATISATION", "title": "Une piste : soutenir la détection avec une IA", "subtitle": "« Ajouter de l’IA » ne définit pas encore la solution.", "points": ["• Piste : Un système de vision artificielle analyse chaque produit et signale les anomalies potentielles.", "• Questions ergonomiques critiques :", "  - Que devrait détecter l’IA?", "  - Que devrait décider l’humain?", "  - Qui devrait vérifier quoi?", "• Nécessité : Décider comment répartir le travail entre la personne et la technologie."], "raw_text": "CONCEVOIR 103\nUne piste : soutenir la détection avec es?\nCONCEVOIR → ÉVALUER / EXPÉRIMENTER\nPour le savoir, il faut l’évaluer."}, {"num": 80, "category": "3 · ÉVALUER & EXPÉRIMENTER", "title": "ÉVALUER / EXPÉRIMENTER", "subtitle": "Vérifier empiriquement ce que la solution change réellement.", "points": ["• Principe : Une solution qui semble bonne en théorie doit encore fonctionner dans la réalité."], "raw_text": "ÉVALUER /\nEXPÉRIMENTER\nVérifier empiriquement ce que la\nsolution change réellement.\nUne solution qui semble bonne en théorie doit encore fonctionner dans la réalité.\nÉVALUER / EXPÉRIMENTER 112"}, {"num": 81, "category": "3 · ÉVALUER & EXPÉRIMENTER", "title": "Qu’est-ce qu’on doit maintenant vérifier?", "subtitle": "Solution conçue : l’IA signale les anomalies potentielles; l’opérateur vérifie et décide.", "points": ["AMÉLIORER :", "• la détection des défauts", "MAINTENIR / PRÉSERVER :", "• une charge mentale acceptable", "• l’autonomie", "• la vigilance", "• Ces objectifs deviennent les critères formels de l’évaluation."], "raw_text": "ÉVALUER / EXPÉRIMENTER 113\nQu’est-ce qu’on doit maintenant\nvérifier?\nSolution conçue : l’IA signale les anomalies potentielles; l’opérateur vérifie et\nprend la décision finale.\nAMÉLIORER\n• la détection des défauts\nMAINTENIR / PRÉSERVER\n• une charge mentale acceptable\n• autonomie\n• vigilance\nCes objectifs deviennent les critères de l’évaluation."}, {"num": 82, "category": "3 · ÉVALUER & EXPÉRIMENTER", "title": "On peut réutiliser les mêmes types de mesures", "subtitle": "La question change, mais plusieurs mesures restent identiques.", "points": ["DANS COMPRENDRE :", "• Elles nous aident à caractériser le travail et le problème initial.", "DANS ÉVALUER :", "• Elles nous aident à voir ce qui change avec la nouvelle solution.", "• Mesures mobilisées : physiologiques (FC, AED), perceptuelles (charge mentale, autonomie, satisfaction), observationnelles (erreurs, temps, vérifications, interventions)."], "raw_text": "On peut réutiliser les mêmes types de\nmesures\nLa dans le système avant de décider quoi modifier.", "points": [], "raw_text": "19\nCOMPRENDRE\nComprendre ce qui se passe\ndans le système avant de\ndécider quoi modifier."}, {"num": 19, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Supposons qu’au cours d’une observation, on note ceci…", "subtitle": "Qu’est-ce qu’on sait? On sait ce qui s’est produit. Pas encore pourquoi.", "points": ["1. Une opératrice supervise plusieurs machines.", "2. Une alarme apparaît sur le véhicule B.", "3. L’opérateur sélectionne le véhicule A et lui envoie une commande."], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 20\nSupposons qu’au cours d’une observation,\non note ceci…\n1 Une opératrice supervise plusieurs machines.\n2 Une alarme apparaît sur le véhicule B.\n3 L’opérateur sélectionne le véhicule A et lui envoie une commande.\nQu’est-ce qu’on sait?\nOn sait ce qui s’est produit. Pas encore pourquoi."}, {"num": 20, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "« Erreur humaine » décrit le résultat, pas la cause", "subtitle": "OBSERVATION : Mauvais véhicule sélectionné.", "points": ["• Pour expliquer ce qui s’est passé, il faut revenir à l’ensemble du système sociotechnique.", "• Qu’est-ce qui, dans le système, a pu contribuer au résultat?", "• Éléments à explorer : les personnes · le travail · l’organisation · les technologies · le contexte"], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 21\n\"Erreur humaine\" décrit le résultat, pas la\ncause\nOBSERVATION : Mauvais véhicule sélectionné.\nPour expliquer ce qui s’est passé, il faut revenir à l’ensemble du système\nsociotechnique.\nQu’est-ce qui, dans le système, a pu contribuer au résultat?\nles personnes le travail l’organisation les technologies le contexte"}, {"num": 21, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "1 · TECHNOLOGIE / INTERFACE", "subtitle": "Pistes d'explication technologiques", "points": ["• L’information nécessaire était-elle disponible?", "• L’alarme indiquait-elle clairement quel véhicule était concerné?", "• Les véhicules ou commandes étaient-ils faciles à distinguer?", "• L’état du système était-il clair?", "• Le retour après une action était-il suffisamment visible?"], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 22\n1 · TECHNOLOGIE / INTERFACE\n• L’information nécessaire était-elle disponible?\n• L’alarme indiquait-elle clairement quel véhicule était concerné?\n• Les véhicules ou commandes étaient-ils faciles à distinguer?\n• L’état du système était-il clair?\n• Le retour après une action était-il suffisamment visible?"}, {"num": 22, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "2 · TÂCHE / CONTEXTE", "subtitle": "On cherche ce que le travail demandait à ce moment précis.", "points": ["• Combien de machines l’opératrice surveillait-elle?", "• Que devait-elle faire en parallèle?", "• Plusieurs alarmes ou événements se produisaient-ils?", "• Y avait-il de la pression temporelle?", "• Des interruptions?", "• La situation était-elle inhabituelle?"], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 23\n2 · TÂCHE / CONTEXTE\n• Combien de machines l’opératrice surveillait-elle?\n• Que devait-elle faire en parallèle?\n• Plusieurs alarmes ou événements se produisaient-ils?\n• Y avait-il de la pression temporelle?\n• Des interruptions?\n• La situation était-elle inhabituelle?\nOn cherche ce que le travail demandait à ce moment précis."}, {"num": 23, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "3 · ORGANISATION / INTERACTIONS", "subtitle": "L’action individuelle s’inscrit dans une organisation et des interactions.", "points": ["• Les rôles étaient-ils clairs?", "• Qui devait surveiller quoi?", "• La communication était-elle adéquate?", "• Le personnel était-il suffisant?", "• La formation préparait-elle à ce type de situation?"], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 24\n3 · ORGANISATION / INTERACTIONS\n• Les rôles étaient-ils clairs?\n• Qui devait surveiller quoi?\n• La communication était-elle adéquate?\n• Le personnel était-il suffisant?\n• La formation préparait-elle à ce type de situation?\nL’action individuelle s’inscrit dans une organisation et des interactions."}, {"num": 24, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Plusieurs explications deviennent possibles", "subtitle": "À ce stade, ce sont encore des hypothèses. Comment savoir lesquelles sont pertinentes?", "points": ["TECHNOLOGIE : Le mauvais véhicule était peut-être difficile à distinguer.", "TÂCHE : L’opérateur gérait peut-être plusieurs demandes simultanément.", "ORGANISATION : La répartition des responsabilités était peut-être ambiguë."], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 25\nPlusieurs explications deviennent possibles\nTECHNOLOGIE\nLe mauvais véhicule\nétait peut-être difficile à\ndistinguer.\nTÂCHE\nL’opérateur gérait peut-\nêtre plusieurs\ndemandes\nsimultanément.\nORGANISATION\nLa répartition des\nresponsabilités était\npeut-être ambiguë.\nMais à ce stade, ce sont encore des hypothèses.\nComment savoir lesquelles sont réellement pertinentes?"}, {"num": 25, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Avant de conclure que le problème vient de…", "subtitle": "Manque d’attention? Trop de charge mentale? Trop de stress? Ambiguïté des rôles?", "points": ["• Il faut d’abord comprendre ce que la personne devait réellement accomplir et dans quelles conditions.", "• C’est là que l’analyse de la tâche devient utile."], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 26\nAvant de conclure que le problème vient\nde…\nMANQUE D’ATTENTION? TROP DE CHARGE MENTALE?\nTROP DE STRESS? AMBIGUITÉ DES ROLES?\nIl faut d’abord comprendre ce que la personne devait réellement\naccomplir et dans quelles conditions.\nC’est là que l’analyse de la tâche devient utile."}, {"num": 26, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Analyse de la tâche / du travail", "subtitle": "Décrire ce que la personne doit accomplir et ce dont elle a besoin pour y arriver.", "points": ["1. Quel est l’objectif?", "2. Quelles actions / étapes?", "3. Quelle information est nécessaire?", "4. Quelles décisions doivent être prises?", "5. Quelles contraintes / interactions influencent le travail?"], "raw_text": "Analyse de la tâche/du travail\nDécrire ce que la personne doit accomplir et ce dont elle a besoin pour\ny arriver.\n1. Quel est l’objectif?\n2. Quelles actions / étapes?\n3. Quelle information est nécessaire?\n4. Quelles décisions doivent être prises?\n5. Quelles contraintes / interactions influencent le travail?\nCOMPRENDRE · SYSTÈME ET TRAVAIL 27"}, {"num": 27, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Exemple : téléopérer une machine", "subtitle": "À partir de là, on peut commencer à demander quelles dimensions humaines sont pertinentes.", "points": ["• Objectif : Réaliser l’opération prévue", "• Information nécessaire : État des machines, environnement, alarmes", "• Actions et décisions : Surveiller, sélectionner, intervenir, reprendre le contrôle", "• Contraintes : Plusieurs véhicules, interruptions, variabilité", "• Interactions : Automatisation, autres travailleurs, procédures"], "raw_text": "Exemple : téléopérer une machine\nCOMPRENDRE · SYSTÈME ET TRAVAIL 28\nÀ partir de là, on peut commencer à demander quelles dimensions humaines sont réellement pertinentes.\nCe qu’on cherche à\ncomprendre Dans cet exemple\nObjectif Réaliser l’opération prévue\nInformation nécessaire État des machines, environnement,\nalarmes\nActions et décisions Surveiller, sélectionner, intervenir,\nreprendre le contrôle\nContraintes Plusieurs véhicules, interruptions,\nvariabilité\nInteractions Automatisation, autres travailleurs,\nprocédures"}, {"num": 28, "category": "1 · COMPRENDRE — SYSTÈME ET TRAVAIL", "title": "Maintenant qu’on comprend la tâche et le travail…", "subtitle": "Qu’est-ce qu’on peut vouloir comprendre du côté humain?", "points": ["COGNITIF : Comment la personne perçoit, comprend et gère les exigences mentales.", "PSYCHOSOCIAL : Comment elle vit son travail et sa relation avec celui-ci.", "COMPORTEMENTAL : Ce qu’elle fait et les résultats observables de son activité."], "raw_text": "COMPRENDRE · SYSTÈME ET TRAVAIL 29\nMaintenant qu’on comprend la tâche et le\ntravail…\nQu’est-ce qu’on peut vouloir comprendre du côté humain?\nCOGNITIF\nComment la personne\nperçoit, comprend et\ngère les exigences\nmentales.\nPSYCHOSOCIAL\nComment elle vit son\ntravail et sa relation\navec celui-ci.\nCOMPORTEMENTAL\nCe qu’elle fait et les\nrésultats observables\nde son activité."}, {"num": 29, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "COGNITIF", "subtitle": "Les processus mentaux et les états qui influencent la façon dont une personne perçoit, comprend et gère les exigences de son travail.", "points": ["• Attention", "• Modèles mentaux", "• Conscience de la situation", "• Charge mentale", "• Vigilance", "• Fatigue"], "raw_text": "COGNITIF\nLes processus mentaux et les états qui influencent la\nfaçon dont une personne perçoit, comprend et gère\nles exigences de son travail.\nCOMPRENDRE · DIMENSIONS HUMAINES 31\nattention modèles mentaux conscience de la situation\ncharge mentale vigilance fatigue\nEtc."}, {"num": 30, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Attention", "subtitle": "Le processus qui permet de sélectionner et de prioriser certaines informations ou actions.", "points": ["• Elle est sélective : certaines informations sont privilégiées alors que d’autres peuvent être moins traitées ou passer inaperçues.", "• RÈGLE D'OR : Present ≠ nécessairement pris en compte.", "• Nos buts et les autres demandes de la situation influencent ce qui reçoit notre attention."], "raw_text": "Attention\nL’attention est le processus qui permet de sélectionner et de prioriser\ncertaines informations ou actions parmi plusieurs possibilités.\nElle est sélective : certaines informations sont privilégiées alors que\nd’autres peuvent être moins traitées ou passer inaperçues.\nPrésent ≠ nécessairement pris en compte\nNos buts et les autres demandes de la situation influencent ce qui\nreçoit notre attention.\nCOMPRENDRE · DIMENSIONS HUMAINES 33\nCOGNITIF"}, {"num": 31, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "En téléopération : plusieurs informations peuvent demander de l’attention", "subtitle": "Qu’est-ce qui doit être remarqué, et à quel moment?", "points": ["• plusieurs machines", "• écrans", "• alarmes", "• événements simultanés", "• communications", "• reprises de contrôle"], "raw_text": "En téléopération : plusieurs informations\npeuvent demander de l’attention\n•plusieurs machines\n•écrans\n•alarmes\n•événements simultanés\n•communications\n•reprises de contrôle.\nQu’est-ce qui doit être\nremarqué, et à quel moment?\nCOMPRENDRE · DIMENSIONS HUMAINES 34"}, {"num": 32, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Remarquer l’information ne suffit pas", "subtitle": "Il faut aussi comprendre comment le système fonctionne et ce que ses actions signifient.", "points": ["→ MODÈLE MENTAL"], "raw_text": "Remarquer l’information ne suffit pas\nIl faut aussi comprendre comment le système\nfonctionne et ce que ses actions signifient.\n→ MODÈLE MENTAL\nCOMPRENDRE · DIMENSIONS HUMAINES 35"}, {"num": 33, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Modèle mental", "subtitle": "Une représentation que la personne se construit du fonctionnement d’un système.", "points": ["• Elle guide ses attentes : « si X se produit, je m’attends à Y. »", "• EXEMPLE : Si je règle le thermostat à 30 °C, la pièce chauffera plus vite.", "• Erreur de modèle mental : cette action suppose que la température réglée contrôle la vitesse de chauffage, alors qu'avec un thermostat simple, elle détermine plutôt la température cible."], "raw_text": "Modèle mental\nUne représentation que la personne se construit du fonctionnement\nd’un système.\nElle guide ses attentes : « si X se produit, je m’attends à Y. »\nEXEMPLE\nSi je règle le thermostat à 30 °C, la pièce chauffera plus vite\nCOMPRENDRE · DIMENSIONS HUMAINES 36\nCOGNITIF\nCette action suppose que la température réglée contrôle la vitesse de chauffage.Avec un thermostat\nsimple, elle détermine plutôt la température cible."}, {"num": 34, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Conscience de la situation", "subtitle": "COGNITIF · Situation awareness", "points": ["• Définition : Maintenir une compréhension de ce qui se passe dans une situation dynamique, de ce que cela signifie et de ce qui pourrait se produire ensuite.", "• TRIPTYQUE FONDAMENTAL : PERCEVOIR → COMPRENDRE → ANTICIPER"], "raw_text": "Conscience de la situation\nCOGNITIF · Situation awareness\nMaintenir une compréhension de ce qui se passe dans une situation\ndynamique, de ce que cela signifie et de ce qui pourrait se produire\nensuite.\nPERCEVOIR → COMPRENDRE → ANTICIPER\nCOMPRENDRE · DIMENSIONS HUMAINES 38"}, {"num": 35, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Même contexte, différentes questions cognitives", "subtitle": "Exemple en téléopération", "points": ["ATTENTION : Quelles informations l’opératrice remarque-t-elle et surveille-t-elle?", "MODÈLE MENTAL : Comment pense-t-il que le système fonctionne et réagit à ses actions?", "CONSCIENCE DE LA SITUATION : Comprend-il l’état actuel des véhicules, ce que cela signifie et ce qui pourrait arriver ensuite?"], "raw_text": "Même contexte, différentes questions\ncognitives\nATTENTION\nQuelles informations l’opératrice remarque-t-\nelle et surveille-t-elle?\nMODÈLE MENTAL\nComment pense-t-il que le système\nfonctionne et réagit à ses actions?\nCONSCIENCE DE LA SITUATION\nComprend-il l’état actuel des véhicules, ce\nque cela signifie et ce qui pourrait arriver\nensuite?\nCOMPRENDRE · DIMENSIONS HUMAINES 39"}, {"num": 36, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Charge mentale", "subtitle": "COGNITIF · Mental workload", "points": ["• La charge mentale correspond à l’effort mental nécessaire pour répondre aux exigences d’une tâche dans une situation donnée."], "raw_text": "Charge mentale\nCOGNITIF · Mental workload\nLa charge mentale correspond à l’effort mental nécessaire pour\nrépondre aux exigences d’une tâche dans une situation donnée.\nCOMPRENDRE · DIMENSIONS HUMAINES 41"}, {"num": 37, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Vigilance", "subtitle": "Maintenir son attention dans le temps afin de détecter des événements pertinents, parfois rares ou imprévisibles.", "points": ["• Séquence : Période calme → Surveillance prolongée → Événement à détecter", "• À retenir : Une tâche peu active peut quand même exiger une surveillance soutenue."], "raw_text": "Vigilance\nMaintenir son attention dans le temps afin de détecter des événements\npertinents, parfois rares ou imprévisibles.\npériode calme → surveillance prolongée → événement à détecter\nUne tâche peu active peut quand même exiger une surveillance soutenue.\nCOMPRENDRE · DIMENSIONS HUMAINES 43\nCOGNITIF"}, {"num": 38, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Fatigue", "subtitle": "Un état qui peut réduire la capacité, ou augmenter l’effort nécessaire, pour maintenir une activité dans le temps.", "points": ["Facteurs contributifs :", "• durée du quart · activité prolongée · exigences répétées · manque de récupération · sommeil / horaire", "* Note : Peut entrer dans plusieurs catégories (physique, cognitive, psychosociale)."], "raw_text": "Fatigue\nUn état qui peut réduire la capacité, ou augmenter l’effort nécessaire,\npour maintenir une activité dans le temps.\n•durée du quart\n•activité prolongée\n•exigences répétées\n•manque de récupération\n•sommeil / horaire\nCOMPRENDRE · DIMENSIONS HUMAINES 44\nCOGNITIF*\n* Peut rentrer dans plusieurs catégories"}, {"num": 39, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "PSYCHOSOCIAL", "subtitle": "Comment la personne vit-elle son travail et sa relation avec celui-ci?", "points": ["• Stress", "• Autonomie", "• Motivation", "• Frustration / satisfaction"], "raw_text": "PSYCHOSOCIAL\nComment la personne vit-elle son travail et sa relation\navec celui-ci?\nCOMPRENDRE · DIMENSIONS HUMAINES 45\nstress autonomie\nmotivation frustration / satisfaction\nEtc."}, {"num": 40, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Stress", "subtitle": "État de tension lorsqu'une personne perçoit que les exigences sont difficiles à gérer avec ses ressources.", "points": ["Sources de stress :", "• pression de temps", "• incertitude", "• conséquences possibles d’une erreur", "• interruptions", "• organisation du travail"], "raw_text": "Stress\nÉtat de tension qui peut apparaître lorsqu’une personne perçoit que les\nexigences ou les enjeux d’une situation sont difficiles à gérer avec les\nressources dont elle dispose.\n•pression de temps\n•incertitude\n•conséquences possibles d’une erreur\n•interruptions\n•organisation du travail.\nCOMPRENDRE · DIMENSIONS HUMAINES 46\nPSYCHOSOCIAL"}, {"num": 41, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Autonomie", "subtitle": "Le degré de liberté et de contrôle qu’une personne perçoit dans l'accomplissement de son travail.", "points": ["• choisir comment réaliser une tâche", "• décider de l’ordre ou du rythme de certaines actions", "• adapter sa façon de faire à la situation", "• intervenir ou reprendre le contrôle lorsque nécessaire"], "raw_text": "Autonomie\nLe degré de liberté et de contrôle qu’une personne perçoit dans la\nfaçon d’organiser et d’accomplir son travail.\n•choisir comment réaliser une tâche\n•décider de l’ordre ou du rythme de certaines actions\n•adapter sa façon de faire à la situation\n•intervenir ou reprendre le contrôle lorsque nécessaire\nCOMPRENDRE · DIMENSIONS HUMAINES 47\nPSYCHOSOCIAL"}, {"num": 42, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Une technologie peut modifier qui prend les décisions", "subtitle": "La personne reste dans le système, mais son rôle peut changer. Est-ce que cela modifie son autonomie?", "points": ["TECHNOLOGIE QUI AIDE À LA DÉCISION :", "• La personne examine et décide.", "TECHNOLOGIE PLUS PRESCRIPTIVE :", "• Le système prend davantage de décisions ou agit automatiquement.", "• La personne surveille, confirme ou intervient au besoin."], "raw_text": "Une technologie peut modifier qui prend les\ndécisions\nLa technologie aide à la décision\nLa personne examine et décide.\nTechnologie plus prescriptive\n• Le système prend davantage de\ndécisions ou agit automatiquement.\n• La personne surveille, confirme ou\nintervient au besoin.\nLa personne reste dans le système, mais son rôle peut changer.\nEst-ce que cela modifie son autonomie?\nCOMPRENDRE · DIMENSIONS HUMAINES 48"}, {"num": 43, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Motivation", "subtitle": "Processus qui orientent l’action, déterminent l’effort investi et soutiennent la persistance dans le temps.", "points": ["TROIS COMPOSANTES :", "• DIRECTION : Vers quoi la personne dirige-t-elle ses efforts?", "• INTENSITÉ : Combien d’effort est-elle prête à investir?", "• PERSISTANCE : Combien de temps maintient-elle cet effort?"], "raw_text": "Motivation\nProcessus qui orientent l’action, déterminent l’effort qu’une\npersonne investit et soutiennent sa persistance dans le temps.\nLa façon dont le travail est organisé, et le rôle laissé à la personne, peut influencer sa\nmotivation.\nCOMPRENDRE · DIMENSIONS HUMAINES 49\nPSYCHOSOCIAL\nDIRECTION\nVers quoi la personne dirige-t-elle ses efforts?\nINTENSITÉ\nCombien d’effort est-elle prête à investir?\nPERSISTANCE\nCombien de temps maintient-elle cet effort?"}, {"num": 44, "category": "1 · COMPRENDRE — DIMENSIONS HUMAINES", "title": "Frustration / satisfaction", "subtitle": "L’expérience du travail ou de l’utilisation d’une technologie peut aussi être pertinente.", "points": ["FRUSTRATION : système imprévisible · étapes inutiles · information difficile à comprendre.", "SATI  effectifs / horaires\n• soutien\n• formation\n• interface / information affichée\n• commandes\n• automatisation\n• équipement\n• disposition du poste\n• environnement technique"}, {"num": 72, "category": "2 · CONCEVOIR — INTERVENTIONS & AUTOMATISATION", "title": "Exemple : une tâche d’inspection de la qualité", "subtitle": "Qu’est-ce que COMPRENDRE nous a appris?", "points": ["• Contexte : Des opérateurs inspectent visuellement des produits pour repérer des défauts avant qu’ils poursuivent la production.", "• Méthode : Avant de concevoir une solution, on a d’abord étudié le système et le travail."], "raw_text": "CONCEVOIR 100\nExemple : une tâche d’inspection de la\nqualité\nDes opérateurs inspectent\nvisuellement des produits pour\nrepérer des défauts avant qu’ils\npoursuivent le processus de\nproduction.\nAvant de concevoir une solution,\non a d’abord étudié le système et\nle travail.\nQu’est-ce que COMPRENDRE nous a appris?"}, {"num": 73, "category": "2 · CONCEVOIR — INTERVENTIONS & AUTOMATISATION", "title": "COMPRENDRE : regarder l’ensemble du système", "subtitle": "Constats sur l'inspection de qualité", "points": ["• TÂCHE / ORGANISATION : inspection répétitive, défauts relativement rares mais importants, périodes de forte cadence.", "• TECHNOLOGIE : la détection repose principalement sur l'inspection visuelle humaine, peu de soutien technique.", "• DIMENSIONS HUMAINES : vigilance soutenue, charge mentale perçue plus élevée sous forte cadence, fatigue.", "• COMPORTEMENT / PERFORMANCE : certaines anomalies sont parfois manquées, davantage de vérifications sous pression."], "raw_text": "CONCEVOIR 101\nCOMPRENDRE : regarder l’ensemble du\nsystème\nTÂCHE / ORGANISATION\n• inspection répétitive\n• défauts relativement rares mais importants\n• périodes de forte cadence\nTECHNOLOGIE\n• la détection repose principalement sur\nl’inspection visuelle humaine\n• peu de soutien technique pour attirer\nl’attention sur les anomalies potentielles\nDIMENSIONS HUMAINES\n• vigilance soutenue\n• charge mentale perçue plus élevée\npendant les périodes les plus exigeantes\n• fatigue possible lorsque l’activité se\nprolonge\nCOMPORTEMENT / PERFORMANCE\n• certaines anomalies sont parfois\nmanquées\n• davantage de vérifications lorsque les\nexigences augmentent"}, {"num": 74, "category": "2 · CONCEVOIR — INTERVENTIONS & AUTOMATISATION", "title": "Du constat au diagnostic", "subtitle": "Établir un diagnostic clair pour fixer l'objectif de conception", "points": ["DIAGNOSTIC :", "• Ce n’est pas simplement un problème de « manque d’attention ».", "• La combinaison d’une surveillance prolongée, de défauts rares et de périodes de forte demande augmente les exigences imposées à l’opérateur.", "OBJECTIF DE CONCEPTION :", "• Soutenir la détection des défauts tout en maintenant une charge mentale acceptable et la capacité de l’opérateur à vérifier et intervenir."], "raw_text": "CONCEVOIR 102\nDu constat au diagnostic\nDIAGNOSTIC\nCe n’est pas simplement un problème de « manque d’attention ».\nLa combinaison d’une surveillance prolongée, de défauts rares et de périodes\nde forte demande peut rendre la détection plus difficile et augmenter les\nexigences imposées à l’opérateur.\nOBJECTIF DE CONCEPTION\nSoutenir la détection des défauts tout en maintenant une charge mentale\nacceptable et la capacité de l’opérateur à vérifier et intervenir."}, {"num": 75, "category": "2 · CONCEVOIR — INTERVENTIONS & AUTOMATISATION", "title": "Une piste : soutenir la détection avec une IA", "subtitle": "« Ajouter de l’IA » ne définit pas encore la solution.", "points": ["• Piste : Un système de vision artificielle analyse chaque produit et signale les anomalies potentielles.", "• Questions ergonomiques critiques :", "  - Que devrait détecter l’IA?", "  - Que devrait décider l’humain?", "  - Qui devrait vérifier quoi?", "• Nécessité : Décider comment répartir le travail entre la personne et la technologie."], "raw_text": "CONCEVOIR 103\nUne piste : soutenir la détection avec es?\nCONCEVOIR → ÉVALUER / EXPÉRIMENTER\nPour le savoir, il faut l’évaluer."}, {"num": 80, "category": "3 · ÉVALUER & EXPÉRIMENTER", "title": "ÉVALUER / EXPÉRIMENTER", "subtitle": "Vérifier empiriquement ce que la solution change réellement.", "points": ["• Principe : Une solution qui semble bonne en théorie doit encore fonctionner dans la réalité."], "raw_text": "ÉVALUER /\nEXPÉRIMENTER\nVérifier empiriquement ce que la\nsolution change réellement.\nUne solution qui semble bonne en théorie doit encore fonctionner dans la réalité.\nÉVALUER / EXPÉRIMENTER 112"}, {"num": 81, "category": "3 · ÉVALUER & EXPÉRIMENTER", "title": "Qu’est-ce qu’on doit maintenant vérifier?", "subtitle": "Solution conçue : l’IA signale les anomalies potentielles; l’opérateur vérifie et décide.", "points": ["AMÉLIORER :", "• la détection des défauts", "MAINTENIR / PRÉSERVER :", "• une charge mentale acceptable", "• l’autonomie", "• la vigilance", "• Ces objectifs deviennent les critères formels de l’évaluation."], "raw_text": "ÉVALUER / EXPÉRIMENTER 113\nQu’est-ce qu’on doit maintenant\nvérifier?\nSolution conçue : l’IA signale les anomalies potentielles; l’opérateur vérifie et\nprend la décision finale.\nAMÉLIORER\n• la détection des défauts\nMAINTENIR / PRÉSERVER\n• une charge mentale acceptable\n• autonomie\n• vigilance\nCes objectifs deviennent les critères de l’évaluation."}, {"num": 82, "category": "3 · ÉVALUER & EXPÉRIMENTER", "title": "On peut réutiliser les mêmes types de mesures", "subtitle": "La question change, mais plusieurs mesures restent identiques.", "points": ["DANS COMPRENDRE :", "• Elles nous aident à caractériser le travail et le problème initial.", "DANS ÉVALUER :", "• Elles nous aident à voir ce qui change avec la nouvelle solution.", "• Mesures mobilisées : physiologiques (FC, AED), perceptuelles (charge mentale, autonomie, satisfaction), observationnelles (erreurs, temps, vérifications, interventions)."], "raw_text": "On peut réutiliser les mêmes types de\nmesures\nLa question change, mais plusieurs mesures peuvent rester les mêmes.\nMESURES PHYSIOLOGIQUES\np. ex. fréquence cardiaque,\nactivité électrodermale\nMESURES PERCEPTUELLES MESURES\nOBSERVATIONNELLES\nDANS COMPRENDRE\nElles nous aident à caractériser le travail\net le problème.\nDANS ÉVALUER\nElles nous aident à voir ce qui change\navec la nouvelle solution.\nÉVALUER / EXPÉRIMENTER 114\ncharge mentale\nautonomie\nsatisfaction\nerreurs temps\nvérifications interventions"}, {"num": 83, "category": "3 · ÉVALUER & EXPÉRIMENTER", "title": "Il faut aussi regarder ce qu’on n’avait pas prévu", "subtitle": "Une solution peut améliorer ce qu’on visait et modifier d'autres aspects du travail.", "points": ["• NOUVEAUX COMPORTEMENTS : sous-vérification (complaisance), stratégie inattendue.", "• NOUVELLES DIFFICULTÉS : nouvelle erreur induite, difficulté de reprise de contrôle.", "• AUTRES EFFETS : frustration, problème déplacé ailleurs dans le système sociotechnique."], "raw_text": "Il faut aussi regarder ce qu’on n’avait pas\nprévu\nUne solution peut améliorer ce qu’on visait et modifier d’autres aspects du travail.\nÉVALUER / EXPÉRIMENTER 118\nNOUVEAUX COMPORTEMENTS\n• sous-vérification\n• stratégie inattendue\nNOUVELLES DIFFICULTÉS\n• nouvelle erreur\n• difficulté de reprise\nAUTRES EFFETS\n• frustration\n• problème déplacé ailleurs dans le système"}, {"num": 84, "category": "3 · ÉVALUER & EXPÉRIMENTER", "title": "À la fin de l’évaluation…", "subtitle": "Et maintenant : qu’est-ce qu’on recommande de faire? → DÉPLOYER / COMMUNIQUER", "points": ["On devrait pouvoir dire clairement :", "• ce qui s’est amélioré", "• ce qui ne s’est pas amélioré", "• quels coûts ou effets inattendus sont apparus", "• ce qu’il faudrait conserver, modifier ou retester"], "raw_text": "ÉVALUER / EXPÉRIMENTER 119\nÀ la fin de l’évaluation…\nOn devrait pouvoir dire :\n• ce qui s’est amélioré\n• ce qui ne s’est pas amélioré\n• quels coûts ou effets inattendus sont apparus\n• ce qu’il faudrait conserver, modif –technologie.\nPSY7010 · 22 SEPTEMBRE 2026 129"}, {"num": 92, "category": "5 · SYNTHÈSE & ANALYSE DE CAS (29 SEPTEMBRE)", "title": "Le 29 septembre : analyser des cas avec ce raisonnement", "subtitle": "On partira de situations réelles et vous mobiliserez les concepts d’aujourd’hui pour les comprendre.", "points": ["1. Qu’est-ce qui est établi dans le cas?", "2. Comment fonctionne le système et le travail?", "3. Quels concepts de facteurs humains aident réellement à expliquer ce qui se passe?", "4. Qu’est-ce qu’on pourrait modifier dans le système, et qu’est-ce qu’il faudrait encore savoir pour évaluer cette piste?"], "raw_text": "Le 29 septembre : analyser des cas avec ce\nraisonnement\nOn partira de situations réelles et vous mobiliserez les concepts d’aujourd’hui\npour les comprendre.\n1. Qu’est-ce qui est établi dans le cas?\n2. Comment fonctionne le système et le travail?\n3. Quels concepts de facteurs humains aident réellement à expliquer ce qui se\npasse?\n4. Qu’est-ce qu’on pourrait modifier dans le système, et qu’est-ce qu’il faudrait\nencore savoir pour évaluer cette piste?\nPSY7010 · 22 SEPTEMBRE 2026 130"}];

    let currentIdx = 0;
    let showRaw = false;

    function renderSlideSelect() {
      const select = document.getElementById('slideSelect');
      select.innerHTML = '';
      slides.forEach((sl, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `D${sl.num}: ${sl.title.substring(0, 28)}...`;
        select.appendChild(opt);
      });
    }

    function renderSlide(idx) {
      if (idx < 0 || idx >= slides.length) return;
      currentIdx = idx;
      const s = slides[idx];

      document.getElementById('slideSelect').value = idx;
      document.getElementById('slideCounter').textContent = `Diapo ${s.num} / ${slides.length}`;

      if (showRaw) {
        document.getElementById('slideContent').innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-xs md:text-sm font-mono px-2.5 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold">DIAPOSITIVE ${s.num} / ${slides.length} (SUPPORT VISUEL TEXTUEL MOT À MOT)</span>
            </div>
            <pre class="verbatim-box p-5 rounded-xl text-sm md:text-base font-mono whitespace-pre-wrap leading-relaxed text-slate-100 overflow-y-auto max-h-[460px]">${s.raw_text}</pre>
          </div>
        `;
      } else {
        let pointsHtml = s.points.map(p => {
          if (p.startsWith('•') || p.startsWith('-')) {
            return `<li class="ml-4 text-slate-100 leading-relaxed text-base md:text-lg">${p}</li>`;
          } else if (p.toUpperCase() === p && p.length > 3 && !p.includes(':')) {
            return `<li class="font-bold text-emerald-400 mt-3.5 uppercase tracking-wider text-sm md:text-base">${p}</li>`;
          } else if (p.startsWith('1.') || p.startsWith('2.') || p.startsWith('3.') || p.startsWith('4.') || p.startsWith('5.')) {
            return `<li class="font-semibold text-emerald-300 mt-2 text-base md:text-lg">${p}</li>`;
          } else {
            return `<li class="text-slate-100 leading-relaxed text-base md:text-lg">${p}</li>`;
          }
        }).join('');

        let catBadge = s.category ? `
          <span class="text-xs font-semibold px-2.5 py-1 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-800/60 uppercase tracking-wider">
            ${s.category}
          </span>
        ` : '';

        document.getElementById('slideContent').innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="text-xs md:text-sm font-mono px-2.5 py-1 rounded bg-slate-800 text-slate-200 border border-slate-700 font-bold">D${s.num}</span>
                ${catBadge}
              </div>
              <button onclick="toggleVerbatim()" class="text-xs text-slate-400 hover:text-emerald-300 transition">Texte brut ↗</button>

            <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-2 leading-snug tracking-tight">${s.title}</h2>
            ${s.subtitle ? `<h3 class="text-base md:text-lg font-medium text-emerald-300/95 mb-4 leading-relaxed border-l-4 border-emerald-500/80 pl-3 py-1">${s.subtitle}</h3>` : ''}
            <div class="mt-4 border-t border-slate-700/60 pt-4">
              <ul class="space-y-2 list-none">
                ${pointsHtml}
              </ul>
            </div>
          </div>
        `;
      }

      document.getElementById('prevBtn').disabled = (currentIdx === 0);
      document.getElementById('nextBtn').disabled = (currentIdx === slides.length - 1);
    }

    let currentZoom = 1.02;
    function adjustZoom(delta) {
      currentZoom = Math.min(2.5, Math.max(0.8, Math.round((currentZoom + delta) * 10) / 10));
      document.getElementById('slideContent').style.zoom = currentZoom;
    }

    function prevSlide() { if (currentIdx > 0) renderSlide(currentIdx - 1); }
    function nextSlide() { if (currentIdx < slides.length - 1) renderSlide(currentIdx + 1); }
    function goToSlide(i) { renderSlide(i); }

    function toggleVerbatim() {
      showRaw = !showRaw;
      const btn = document.getElementById('toggleVerbatimBtn');
      btn.textContent = showRaw ? "🎨 Mode Épuré" : "📄 Mode Brut";
      btn.classList.toggle('bg-emerald-900', showRaw);
      btn.classList.toggle('text-emerald-200', showRaw);
      renderSlide(currentIdx);
    }

    function filterSlides() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) return;
      const foundIdx = slides.findIndex(s => 
        s.title.toLowerCase().includes(q) || 
        (s.subtitle && s.subtitle.toLowerCase().includes(q)) ||
        (s.category && s.category.toLowerCase().includes(q)) ||
        s.raw_text.toLowerCase().includes(q)
      );
      if (foundIdx !== -1) renderSlide(foundIdx);
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === '/') {
        e.preventDefault();

    });
